# Creates a GitHub Release for every v* tag.
#
# `gemini extensions install <repo-url>` (no --ref) fetches the latest
# GitHub Release archive, not the default branch — and so does the Gemini
# CLI extension gallery's crawler. Tags alone (pushed by publish.yml /
# publish-registry.yml) don't produce a Release object, so without this an
# install or a gallery crawl can silently pick up a stale, pre-manifest
# snapshot. See gemini-extension.json and README.md's Gemini CLI section.
name: Create GitHub release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --latest
