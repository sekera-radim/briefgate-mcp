startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - briefgateApiKey
    properties:
      briefgateApiKey:
        type: string
        description: "BriefGate API key (bg_live_... or bg_test_...). Obtain from the dashboard at briefgate.dev."
      briefgateBaseUrl:
        type: string
        description: "Base URL override for staging or local development (e.g. http://localhost:3001). Defaults to the hosted cloud."
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "@briefgate/mcp"],
      env: {
        BRIEFGATE_API_KEY: config.briefgateApiKey,
        ...(config.briefgateBaseUrl ? { BRIEFGATE_BASE_URL: config.briefgateBaseUrl } : {})
      }
    })
